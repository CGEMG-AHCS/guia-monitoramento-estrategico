site_name: Guia de Monitoramento Estratégico
site_description: Guia de Monitoramento Estratégico da CGE-MG

theme:
  name: material
  language: pt-BR

  palette:
    primary: blue
    accent: light blue

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/external-links.js

nav:
  - Início: index.md

  - Bases de Dados:
      - Visão Geral: bases-dados/index.md
      - Estrutura da Unidade: bases-dados/estrutura-rh.md
      - Paci: bases-dados/paci.md
      - Raci: bases-dados/raci.md
      - Manifestações: bases-dados/manifestacoes.md
      - e-CGU: bases-dados/e-cgu.md
      - SisPMPI: bases-dados/sispmpi.md
      - SISCOGE: bases-dados/siscoge.md

  - Monitoramento Estratégico: monitoramento/metodologia.md
