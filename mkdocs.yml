site_name: Guia de Monitoramento Estratégico
site_description: Guia de Monitoramento Estratégico da CGE-MG

theme:
  name: material
  language: pt-BR

  palette:
    primary: green
    accent: light green

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Início: index.md

  - 1. Monitoramento:
      - Visão geral: monitoramento/index.md
      - PACI: monitoramento/paci.md
      - PO: monitoramento/po.md

  - 2. Acompanhamento:
      - Visão geral: acompanhamento/index.md
      - Registro e atualização: acompanhamento/registro.md
      - Resultados e providências: acompanhamento/resultados.md

  - 3. Sistema de Auditoria – e-CGU:
      - Visão geral: ecgu/index.md
      - Acesso e primeiros passos: ecgu/acesso.md
      - Funcionalidades: ecgu/funcionalidades.md
      - Manual prático: ecgu/manual.md

  - 4. Referências e Apoio:
      - Normativos: referencias/normativos.md
      - Documentos de referência: referencias/documentos.md
      - Canais de apoio: referencias/apoio.md

      
