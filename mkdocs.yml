site_name: Guia de Monitoramento Estratégico
site_description: Guia de Monitoramento Estratégico da CGE-MG

theme:
  name: material
  language: pt-BR

  palette:
    primary: blue
    accent: light blue

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
