site_name: Guia de Monitoramento Estratégico
site_description: Guia de Monitoramento Estratégico da CGE-MG

theme:
  name: material
  language: pt-BR

  palette:
    primary: blue
    accent: light blue

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/external-links.js

nav:
  - Início: index.md

  - Monitoramento Estratégico:
      - Metodologia: monitoramento/metodologia.md
      - Estrutura: monitoramento/estrutura-rh.md
      - PACI: monitoramento/paci.md
      - RACI: monitoramento/raci.md
      - Sistema e-CGU: monitoramento/sistema e-cgu.md

  - Bases de Dados:
      - Visão Geral: bases-dados/index.md
      - Estrutura de Recursos Humanos: bases-dados/estrutura-rh.md
      - PACI: bases-dados/paci.md
      - RACI: bases-dados/raci.md

  - Referências e Apoio:
      - e-CGU: referencias/e-cgu.md
      - Normativos: referencias/normativos.md
      - Canais de Apoio: referencias/apoio.md
