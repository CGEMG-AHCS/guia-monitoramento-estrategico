      - PACI: monitoramento/paci.md
      - Matriz RACI: monitoramento/raci.md

  - Bases de Dados:
      - Visão Geral: bases-dados/index.md
      - PACI: bases-dados/paci.md
      - Matriz RACI: bases-dados/raci.md
      - Sistema e-CGU: bases-dados/e-cgu.md

  - Sistema de Auditoria e-CGU:
      - Manual Prático: ecgu/manual.md

  - Referências e Apoio:
      - Normativos: referencias/normativos.md
      - Canais de Apoio: referencias/apoio.md
